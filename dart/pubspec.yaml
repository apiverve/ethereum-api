name: apiverve_ethereum
description: "Ethereum Price is an Ethereum price feed API that tracks the spot price and movement direction of Ethereum in US dollars. Paid plans add 172 currencies, market cap, 24-hour volume, supply, all-time highs, 1-hour to 1-year changes, 30-day stats, and hourly and 30-day daily history."
version: 1.2.5
homepage: https://apiverve.com/marketplace/ethereum?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/ethereum-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
