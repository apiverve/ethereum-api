openapi: 3.0.4
info:
  title: Ethereum Price
  description: >-
    Ethereum Price is an Ethereum price feed API that tracks the spot price and
    movement direction of Ethereum in US dollars. Paid plans add conversion into
    172 currencies, 24-hour trading volume, market capitalization, and hourly
    price snapshots.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/ethereum:
    get:
      summary: Ethereum Price
      description: >-
        Get the current price of Ethereum. You can optionally specify a
        currency, e.g. USD
      operationId: ethereum
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: The currency to get the price in
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include hourly price data for the past 24 hours
          example: true
        - name: hourly[].hour
          in: query
          schema:
            type: number
          required: false
          description: UTC hour-of-day slot (0-23) the price was captured in
        - name: hourly[].price
          in: query
          schema:
            type: number
          required: false
          description: Price at that hour, in the requested currency
        - name: hourly[].timestamp
          in: query
          schema:
            type: string
          required: false
          description: ISO 8601 time the hourly price was captured
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  currency: USD
                  price: 2685.12
                  marketCap: 323000000000
                  volume24h: 14850000000
                  change24h: 2.34
                  lastUpdated: '2026-02-07T12:00:00.000Z'
                  high24h: 2742.5
                  low24h: 2618.75
                  changeDirection: up
                  formatted:
                    price: $2,685.12
                    marketCap: $323.00B
                    volume: $14.85B
                    priceWords: two thousand six hundred eighty-five dollars
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
